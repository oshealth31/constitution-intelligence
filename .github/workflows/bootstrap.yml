name: Bootstrap (lockfile + formatting)
on:
  push:
    branches: [tooling/bootstrap]
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm format
      - run: pnpm audit --prod --audit-level high || true
      - name: Commit lockfile and formatting back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "tooling: generated lockfile and formatting" || echo "nothing to commit"
          git push
