name: Bootstrap (lockfile + formatting)
on:
  push:
    branches: [tooling/bootstrap]
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm format
      - run: git diff -- . ':(exclude).github/workflows/bootstrap.yml' > formatting.patch; git diff --stat
      - run: pnpm audit --prod --audit-level high || true
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-output
          path: |
            pnpm-lock.yaml
            formatting.patch
