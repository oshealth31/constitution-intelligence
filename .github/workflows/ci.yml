name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      postgres:
        # Throwaway database for tests only. "trust" auth means no password is needed or stored.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_DB: ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      TEST_DATABASE_URL: postgresql://ci@localhost:5432/ci

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up pnpm (version from package.json)
        uses: pnpm/action-setup@v6

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies (exact versions from pnpm-lock.yaml)
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm build:packages

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm -r run typecheck

      - name: Test (unit + integration against PostgreSQL)
        run: pnpm -r run test

      - name: Build API and web
        run: pnpm -r --filter @constitution/api --filter @constitution/web run build

      - name: Apply migrations to the CI database
        env:
          DATABASE_URL: postgresql://ci@localhost:5432/ci
        run: pnpm --filter @constitution/db run migrate

      - name: Formatting check
        run: pnpm format:check

      - name: Dependency vulnerability audit (high and critical)
        run: pnpm audit --prod --audit-level high

  e2e:
    name: Browser tests (control centre)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_DB: ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://ci@localhost:5432/ci
      STORAGE_LOCAL_DIR: /tmp/ci-e2e-storage
      API_INTERNAL_URL: http://127.0.0.1:4100

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up pnpm (version from package.json)
        uses: pnpm/action-setup@v6

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies (exact versions from pnpm-lock.yaml)
        run: pnpm install --frozen-lockfile

      - name: Build packages, API and web app
        run: |
          pnpm build:packages
          pnpm --filter @constitution/api run build
          pnpm --filter @constitution/web run build

      - name: Apply database migrations
        run: pnpm --filter @constitution/db run migrate

      - name: Install Chromium for Playwright
        run: pnpm --filter @constitution/web exec playwright install --with-deps chromium

      - name: Run browser tests against the real API and database
        run: pnpm --filter @constitution/web run test:e2e
