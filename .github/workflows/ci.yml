name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      postgres:
        # Throwaway database for tests only. "trust" auth means no password is needed or stored.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_DB: ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      TEST_DATABASE_URL: postgresql://ci@localhost:5432/ci

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up pnpm (version from package.json)
        uses: pnpm/action-setup@v5

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies (exact versions from pnpm-lock.yaml)
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm build:packages

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm -r run typecheck

      - name: Test (unit + integration against PostgreSQL)
        run: pnpm -r run test

      - name: Build API and web
        run: pnpm -r --filter @constitution/api --filter @constitution/web run build

      - name: Apply migrations to the CI database
        env:
          DATABASE_URL: postgresql://ci@localhost:5432/ci
        run: pnpm --filter @constitution/db run migrate

      - name: Formatting check
        run: pnpm format:check

      - name: Dependency vulnerability audit (high and critical)
        run: pnpm audit --prod --audit-level high

  e2e:
    name: Browser tests (control centre)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_DB: ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://ci@localhost:5432/ci
      STORAGE_LOCAL_DIR: /tmp/ci-e2e-storage
      API_INTERNAL_URL: http://127.0.0.1:4100

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up pnpm (version from package.json)
        uses: pnpm/action-setup@v5

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies (exact versions from pnpm-lock.yaml)
        run: pnpm install --frozen-lockfile

      - name: Build packages, API and web app
        run: |
          pnpm build:packages
          pnpm --filter @constitution/api run build
          pnpm --filter @constitution/web run build

      - name: Apply database migrations
        run: pnpm --filter @constitution/db run migrate

      - name: Install Chromium for Playwright
        run: pnpm --filter @constitution/web exec playwright install --with-deps chromium

      - name: Run browser tests against the real API and database
        run: pnpm --filter @constitution/web run test:e2e

  # Task T1: the same tests in Firefox and Safari's engine (WebKit), and the phone tests on an
  # emulated iPhone (WebKit) and Android phone (Chrome). Each browser gets its own database.
  e2e-browsers:
    name: Browser tests (${{ matrix.browser }})
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit, mobile-safari, mobile-chrome]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_DB: ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://ci@localhost:5432/ci
      STORAGE_LOCAL_DIR: /tmp/ci-e2e-storage
      API_INTERNAL_URL: http://127.0.0.1:4100
      E2E_BROWSER: ${{ matrix.browser }}

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Build packages, API and web app
        run: |
          pnpm build:packages
          pnpm --filter @constitution/api run build
          pnpm --filter @constitution/web run build
      - name: Apply database migrations
        run: pnpm --filter @constitution/db run migrate
      - name: Install the browser engine
        run: |
          case "$E2E_BROWSER" in
            firefox) engine=firefox ;;
            webkit|mobile-safari) engine=webkit ;;
            *) engine=chromium ;;
          esac
          pnpm --filter @constitution/web exec playwright install --with-deps "$engine"
      - name: Run browser tests
        run: pnpm --filter @constitution/web run test:e2e
      - name: Show what the page looked like when a test failed
        if: failure()
        run: |
          find apps/web/test-results -name error-context.md | while read -r file; do
            echo "::group::$file"; head -c 6000 "$file"; echo; echo "::endgroup::"
          done
      - name: Keep failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ matrix.browser }}
          path: apps/web/test-results
          retention-days: 7
