# Deployment readiness check, in a throwaway GitHub runner (never a live system):
#  1. builds the production images (api, web, ops) from infra/production/Dockerfile;
#  2. starts the production layout (Caddy HTTPS -> web -> API -> PostgreSQL with TLS) in
#     production mode, with freshly generated secrets and certificates;
#  3. checks HTTPS, headers, health checks, the client address through the proxies, the
#     non-superuser database account, and that unsafe settings and the dev seed are refused;
#  4. backup and restore test: fictional data -> encrypted backup -> restore into a NEW
#     database and storage -> row counts, file checksums, security rules and a real sign-in
#     on the restored copy;
#  5. exports one organisation and checks the export contains only that organisation;
#  6. off-site copy (Task D7) to a throwaway SFTP server with an add-only account, then the
#     restore test uses the copy downloaded back from it.
name: Deployment check

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'ops/**'
      - 'apps/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deployment-check.yml'
  schedule:
    - cron: '41 3 * * 1' # weekly restore test, Mondays 03:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment:
    name: Production images, HTTPS stack, backup and restore test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: infra/production
    env:
      SITE_ADDRESS: localhost
      API_IMAGE: constitution-api:ci
      WEB_IMAGE: constitution-web:ci
      OPS_IMAGE: constitution-ops:ci
      COMPOSE_PROJECT_NAME: constitution-intelligence
      # The production layout plus a throwaway mail server (CI only).
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4

      - name: Build production images
        working-directory: .
        run: |
          docker build -f infra/production/Dockerfile --target api -t "$API_IMAGE" .
          docker build -f infra/production/Dockerfile --target web -t "$WEB_IMAGE" \
            --build-arg API_INTERNAL_URL=http://api:4000 .
          docker build -f infra/production/Dockerfile --target ops -t "$OPS_IMAGE" .
          docker image ls | grep constitution

      - name: Images run as an unprivileged user and contain no secrets
        run: |
          for image in "$API_IMAGE" "$WEB_IMAGE"; do
            user="$(docker run --rm --entrypoint id "$image" -un)"
            echo "[deploy-test] $image runs as: $user"
            test "$user" = node
            if docker run --rm --entrypoint sh "$image" -c 'ls -a /app; ls -a /app/apps 2>/dev/null' | grep -E '^\.env$'; then
              echo "[deploy-test] FAIL an .env file is inside $image"; exit 1
            fi
          done
          echo "[deploy-test] ok images run as 'node' and contain no .env files"

      - name: Generate throwaway secrets and certificates (this run only)
        run: |
          mkdir -p secrets backups exports
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=CI throwaway database CA" \
            -keyout ca.key -out secrets/database_ca.crt 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -subj "/CN=postgres" \
            -keyout secrets/database_server.key -out server.csr 2>/dev/null
          printf 'subjectAltName=DNS:postgres\n' > san.ext
          openssl x509 -req -in server.csr -CA secrets/database_ca.crt -CAkey ca.key -CAcreateserial \
            -days 2 -extfile san.ext -out secrets/database_server.crt 2>/dev/null
          sudo chown 0:999 secrets/database_server.key && sudo chmod 0640 secrets/database_server.key
          openssl rand -hex 24 > secrets/postgres_password
          openssl rand -hex 24 > secrets/app_db_password
          openssl rand -hex 24 > secrets/migrator_db_password
          openssl rand -hex 32 > secrets/backup_passphrase
          openssl rand -hex 24 > secrets/smtp_password
          openssl rand -hex 32 > secrets/mfa_encryption_key
          # Audit seal signing key (Task D12), made by the API image itself.
          docker run --rm --entrypoint node "$API_IMAGE" dist/cli/audit-seal.js --generate-key > secrets/audit_seal_key
          grep -q 'BEGIN PRIVATE KEY' secrets/audit_seal_key
          echo "OFFSITE_AUDIT_REMOTE=offsite:/data/audit-seals/prod" >> "$GITHUB_ENV"
          # Throwaway SFTP server standing in for the off-site location: "copier" (add and read
          # only, used by the nightly copy) and "keeper" (may delete, used for pruning).
          mkdir -p ci-offsite-keys
          ssh-keygen -q -t ed25519 -N '' -f copier.key && cp copier.key.pub ci-offsite-keys/copier
          ssh-keygen -q -t ed25519 -N '' -f keeper.key && cp keeper.key.pub ci-offsite-keys/keeper
          chmod 0644 ci-offsite-keys/*
          echo "OFFSITE_REMOTE=offsite:/data/backups/prod" >> "$GITHUB_ENV"
          conf() { printf '[offsite]\ntype = sftp\nhost = offsite\nuser = %s\ndisable_hashcheck = true\nkey_pem = %s\n' "$1" "$(awk '{printf "%s\\n", $0}' "$2")"; }
          conf copier copier.key > secrets/rclone.conf
          conf keeper keeper.key > secrets/rclone-admin.conf
          docker compose build offsite
          # Throwaway mail server certificate, signed by the same throwaway CA the API trusts.
          mkdir -p ci-mail
          openssl req -newkey rsa:2048 -nodes -subj "/CN=mailpit" \
            -keyout ci-mail/mail.key -out mail.csr 2>/dev/null
          printf 'subjectAltName=DNS:mailpit\n' > mail.ext
          openssl x509 -req -in mail.csr -CA secrets/database_ca.crt -CAkey ca.key -CAcreateserial \
            -days 2 -extfile mail.ext -out ci-mail/mail.crt 2>/dev/null
          chmod 0644 ci-mail/mail.key
          printf 'postgresql://constitution_app:%s@postgres:5432/constitution' "$(cat secrets/app_db_password)" > secrets/database_url
          printf 'postgresql://constitution_migrator:%s@postgres:5432/constitution' "$(cat secrets/migrator_db_password)" > secrets/database_migrator_url
          # Restores run with the migration account (it will own the restored tables); the
          # restored API uses the application account, as in production.
          printf 'postgresql://constitution_migrator:%s@postgres:5432/constitution_restore' "$(cat secrets/migrator_db_password)" > secrets/restore_migrator_url
          printf 'postgresql://constitution_app:%s@postgres:5432/constitution_restore' "$(cat secrets/app_db_password)" > secrets/restore_url
          cp api.env.example api.env
          sed -i 's#https://portal.example.co.bw#https://localhost#g; s#^APP_VERSION=.*#APP_VERSION=ci#' api.env
          sed -i 's#^SMTP_HOST=.*#SMTP_HOST=mailpit#; s#^SMTP_PORT=.*#SMTP_PORT=1025#; s#^SMTP_USER=.*#SMTP_USER=ci-sender#' api.env
          sed -i 's#^MAIL_FROM=.*#MAIL_FROM=Constitution Intelligence <no-reply@example.test>#; s#^MAIL_REPLY_TO=.*#MAIL_REPLY_TO=support@example.test#' api.env

      - name: Start the database (TLS on) and apply migrations with the migration account
        run: |
          docker compose up -d --wait postgres
          docker compose --profile migrate run --rm migrate

      - name: Start API, web app and HTTPS proxy in production mode
        run: |
          docker compose up -d --wait api web caddy
          for i in $(seq 1 30); do
            curl -sk -o /dev/null -w '%{http_code}' https://localhost/api/health | grep -q 200 && break
            sleep 2
          done

      - name: HTTPS, headers and health checks
        run: |
          set -e
          code() { curl -sk -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code https://localhost/api/health)" = 200
          test "$(code https://localhost/api/v1/health/ready)" = 200
          redirect="$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)"
          echo "[deploy-test] plain HTTP answers $redirect"; [[ "$redirect" =~ ^30[178]$ ]]
          headers="$(curl -skI https://localhost/o/no-such-portal)"
          echo "$headers" | grep -qi '^strict-transport-security: max-age=31536000'
          echo "$headers" | grep -qi "^content-security-policy: .*script-src 'self' 'nonce-"
          api_headers="$(curl -skI https://localhost/api/v1/health/live)"
          echo "$api_headers" | grep -qi '^cache-control: no-store'
          ! echo "$api_headers" | grep -qi '^x-powered-by'
          ! echo "$api_headers" | grep -qi '^server:'
          bash ../../ops/check-health.sh https://localhost || true # certificate check needs a public CA
          echo "[deploy-test] ok HTTPS, redirect, HSTS, page and API security headers, health checks"

      - name: The API sees the visitor's address through both proxies (TRUST_PROXY=2)
        run: |
          set -e
          curl -sk -o /dev/null -w '%{http_code}\n' -X POST https://localhost/api/v1/auth/login \
            -H 'Content-Type: application/json' -H 'X-Requested-With: XMLHttpRequest' \
            -H 'Origin: https://localhost' \
            -d '{"email":"nobody@example.test","password":"definitely the wrong password"}'
          seen="$(docker compose exec -T postgres psql -U constitution_owner -d constitution -Atc \
            "SELECT ip_address FROM audit_events WHERE action = 'auth.login.failed' ORDER BY occurred_at DESC LIMIT 1")"
          caddy_ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' "$(docker compose ps -q caddy)")"
          web_ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' "$(docker compose ps -q web)")"
          echo "[deploy-test] address recorded: $seen (caddy: $caddy_ip; web: $web_ip)"
          test -n "$seen"
          for proxy in $caddy_ip $web_ip; do test "$seen" != "$proxy"; done
          echo "[deploy-test] ok the recorded address is the visitor's, not a proxy's"

      - name: Two database accounts; the application's owns nothing and cannot change the rules
        run: |
          set -e
          url="$(sed 's#@postgres:#@localhost:#' secrets/database_url)"
          app() { docker compose exec -T postgres psql "$url" -Atq -c "$1" 2>&1 || true; }
          flags="$(app "SELECT rolsuper::text || ',' || rolcreaterole::text || ',' || rolbypassrls::text FROM pg_roles WHERE rolname = current_user")"
          echo "[deploy-test] constitution_app superuser,createrole,bypassrls = $flags"
          test "$flags" = "false,false,true"
          owners="$(docker compose exec -T postgres psql -U constitution_owner -d constitution -Atc \
            "SELECT DISTINCT pg_get_userbyid(c.relowner) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relkind = 'r'")"
          echo "[deploy-test] tables owned by: $owners"
          test "$owners" = "constitution_migrator"
          test "$(docker compose exec -T postgres psql -U constitution_owner -d constitution -Atc \
            "SELECT rolsuper::text FROM pg_roles WHERE rolname = 'constitution_migrator'")" = "false"
          app "UPDATE audit_events SET action = 'x'" | grep -q 'permission denied'
          app "TRUNCATE audit_events" | grep -q 'permission denied'
          app "ALTER TABLE audit_events DISABLE TRIGGER audit_events_no_update_or_delete" | grep -q 'must be owner'
          app "DROP TABLE organisations CASCADE" | grep -q 'must be owner'
          app "CREATE TABLE sneaky (id int)" | grep -q 'permission denied'
          echo "[deploy-test] ok migrations by constitution_migrator; constitution_app is not a superuser, owns no table and cannot alter, empty or un-protect the audit log"
      - name: Unsafe production settings and the development seed are refused
        run: |
          set +e
          out="$(docker run --rm -e NODE_ENV=production -e APP_ENV=production \
            -e DATABASE_URL=postgresql://u:p@db.invalid/x "$API_IMAGE" 2>&1)"; status=$?
          set -e
          echo "$out" | tail -n 12
          test "$status" -ne 0
          echo "$out" | grep -q 'DATABASE_SSL must be true'
          echo "$out" | grep -q 'CORS_ORIGINS must list the allowed web origins'
          echo "$out" | grep -q 'MFA_ENCRYPTION_KEY is required in staging and production'
          set +e
          seed="$(docker compose run --rm -T api node dist/cli/seed-dev.js 2>&1)"; status=$?
          set -e
          test "$status" -ne 0
          echo "$seed" | grep -q 'Refusing to seed'
          echo "[deploy-test] ok unsafe settings stop the API; the development seed refuses production"

      - name: Load fictional test data (this throwaway run only)
        run: |
          docker compose run --rm -T -e APP_ENV=local -e NODE_ENV=development \
            api node dist/cli/seed-dev.js > seed-output.txt 2>&1 || { tail -n 30 seed-output.txt; exit 1; }
          grep -c '@sample.test' seed-output.txt

      - name: Email leaves the API over encrypted SMTP (password reset)
        run: |
          set -e
          code="$(curl -sk -o /dev/null -w '%{http_code}' -X POST https://localhost/api/v1/auth/password/forgot \
            -H 'Content-Type: application/json' -H 'X-Requested-With: XMLHttpRequest' \
            -H 'Origin: https://localhost' -d '{"email":"member@sample.test"}')"
          test "$code" = 202
          mail() { docker run --rm --network constitution-intelligence_egress curlimages/curl:8.10.1 -s "http://mailpit:8025$1"; }
          for i in $(seq 1 20); do
            list="$(mail /api/v1/messages)"
            [ "$(echo "$list" | jq '.total')" -gt 0 ] && break
            sleep 2
          done
          echo "$list" | jq '{total, to: [.messages[].To[].Address], subject: [.messages[].Subject]}'
          id="$(echo "$list" | jq -r '.messages[0].ID')"
          test "$(echo "$list" | jq -r '.messages[0].To[0].Address')" = member@sample.test
          message="$(mail "/api/v1/message/$id")"
          echo "$message" | jq -r '.Text' | grep -q 'https://localhost/reset-password?token='
          echo "$message" | jq -r '.HTML' | grep -q 'Choose a new password'
          test "$(echo "$message" | jq -r '.From.Address')" = no-reply@example.test
          echo "[email-test] ok reset email sent over STARTTLS (required by the mail server), text and HTML, link to https://localhost"

      - name: Back up (encrypted)
        run: |
          docker compose --profile ops run --rm -T ops
          backup="$(ls -d backups/20*Z | tail -n 1)"
          echo "BACKUP=$backup" >> "$GITHUB_ENV"
          sudo ls -l "$backup"
          sudo cat "$backup/manifest.txt" | sed 's/^/[restore-test] manifest /'
          # Nothing readable without the passphrase.
          ! sudo grep -aq 'Sample Community Choir' "$backup/database.dump.gpg"
          echo "[restore-test] ok backup written and encrypted"

      - name: Off-site copy with an add-only account, checked, and downloaded back
        run: |
          set -e
          folder="$(basename "$BACKUP")"
          keeper() { docker compose --profile ops run --rm -T -v "$PWD/secrets/rclone-admin.conf:/admin.conf:ro" -e RCLONE_CONFIG=/admin.conf "$@"; }
          docker compose --profile ops run --rm -T ops /ops/offsite-copy.sh | sed 's/^/[offsite-test] /'
          docker compose --profile ops run --rm -T ops /ops/offsite-copy.sh | tee second.txt
          grep -q 'nothing new to copy' second.txt
          sudo test -s backups/.offsite-last-success
          # The copy account cannot delete what is off-site.
          set +e
          docker compose --profile ops run --rm -T ops sh -c "rclone deletefile \"\$OFFSITE_REMOTE/$folder/manifest.txt\"" > del.txt 2>&1; deleted=$?
          set -e
          tail -n 3 del.txt
          test "$deleted" -ne 0
          keeper ops sh -c "rclone lsf \"\$OFFSITE_REMOTE/$folder\"" | tee held.txt
          grep -qx 'manifest.txt' held.txt
          grep -qx 'database.dump.gpg' held.txt
          echo "[offsite-test] ok the add-only account cannot delete off-site backups"
          # Download it back into an empty folder (as after losing the server) and check it.
          mkdir -p fetched
          docker compose --profile ops run --rm -T -v "$PWD/fetched:/fetched" -e BACKUP_DIR=/fetched ops \
            /ops/offsite-fetch.sh "$folder" | sed 's/^/[offsite-test] /'
          sudo cmp "fetched/$folder/database.dump.gpg" "$BACKUP/database.dump.gpg"
          sudo cmp "fetched/$folder/storage.tar.gz.gpg" "$BACKUP/storage.tar.gz.gpg"
          echo "RESTORE_SOURCE=fetched" >> "$GITHUB_ENV"
          echo "[offsite-test] ok copied, checked, and downloaded back identical; the restore below uses the downloaded copy"

      - name: Thinning out old off-site backups (separate account that may delete)
        run: |
          set -e
          keeper() { docker compose --profile ops run --rm -T -v "$PWD/secrets/rclone-admin.conf:/admin.conf:ro" -e RCLONE_CONFIG=/admin.conf "$@"; }
          for old in 20250101T013000Z 20250102T013000Z 20250201T013000Z; do
            keeper ops sh -c "echo test | rclone rcat \"\$OFFSITE_REMOTE/$old/SHA256SUMS\""
          done
          keeper -e OFFSITE_KEEP_DAILY=2 -e OFFSITE_KEEP_MONTHLY=1 ops /ops/offsite-prune.sh | tee plan.txt
          grep -q 'would remove 20250101T013000Z' plan.txt
          grep -q 'would remove 20250102T013000Z' plan.txt
          keeper -e OFFSITE_KEEP_DAILY=2 -e OFFSITE_KEEP_MONTHLY=1 ops /ops/offsite-prune.sh --yes
          left="$(keeper ops sh -c 'rclone lsf --dirs-only "$OFFSITE_REMOTE"' | tr -d '/' | sort | tr '\n' ' ')"
          echo "[offsite-test] left off-site: $left"
          test "$left" = "20250201T013000Z $(basename "$BACKUP") "
          echo "[offsite-test] ok old backups removed, the newest kept"

      - name: Restore into a NEW database and NEW storage
        run: |
          set -e
          admin() { docker compose exec -T postgres psql -U constitution_owner -v ON_ERROR_STOP=1 "$@"; }
          admin -d constitution -c 'CREATE DATABASE constitution_restore OWNER constitution_migrator'
          admin -d constitution_restore -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm' \
            -c 'CREATE EXTENSION IF NOT EXISTS vector' -c 'ALTER SCHEMA public OWNER TO constitution_migrator'
          docker volume create ci-restored-storage
          docker run --rm --network constitution-intelligence_data \
            -v "$PWD/${RESTORE_SOURCE:-backups}:/backups:ro" -v "$PWD/secrets:/s:ro" -v ci-restored-storage:/restored \
            -e TARGET_DATABASE_URL_FILE=/s/restore_migrator_url -e TARGET_STORAGE_DIR=/restored \
            -e BACKUP_PASSPHRASE_FILE=/s/backup_passphrase \
            -e PGSSLMODE=verify-full -e PGSSLROOTCERT=/s/database_ca.crt \
            "$OPS_IMAGE" /ops/restore.sh "/backups/$(basename "$BACKUP")" | sed 's/^/[restore-test] /'

      - name: Restored files are byte-for-byte identical
        run: |
          set -e
          sums() { docker run --rm -v "$1:/d:ro" "$OPS_IMAGE" bash -c 'cd /d && find . -type f -exec sha256sum {} + | sort -k2'; }
          sums constitution-intelligence_storage > original.sha
          sums ci-restored-storage > restored.sha
          diff original.sha restored.sha
          echo "[restore-test] ok $(wc -l < restored.sha) files identical (SHA-256)"

      - name: Security rules survive the restore
        run: |
          set -e
          q() { docker compose exec -T postgres psql -U constitution_owner -d constitution_restore -Atc "$1"; }
          tamper="$(q "UPDATE audit_events SET action = 'tampered'" 2>&1 || true)"
          echo "$tamper" | grep -q 'audit_events is append-only'
          choir="$(q "SELECT id FROM organisations WHERE slug = 'sample-community-choir'")"
          visible="$(docker compose exec -T postgres psql -U constitution_owner -d constitution_restore -Atq \
            -c 'BEGIN' -c 'SET LOCAL ROLE app_tenant' \
            -c "SELECT set_config('app.current_organisation_id', '$choir', true)" \
            -c 'SELECT count(*) FROM organisations' -c 'COMMIT' | sed -n 2p)"
          echo "[restore-test] organisations visible to the tenant role: $visible"
          test "$visible" = 1
          echo "[restore-test] ok audit log still append-only; row-level security still isolates organisations"

      - name: The application works on the restored copy (real sign-in)
        run: |
          set -e
          password="$(grep 'member@sample.test' seed-output.txt | head -n 1 | awk '{print $NF}')"
          docker run -d --name api-restored --network constitution-intelligence_data \
            --env-file api.env -e DATABASE_URL_FILE=/s/restore_url -e NODE_EXTRA_CA_CERTS=/s/database_ca.crt \
            -e SMTP_PASSWORD_FILE=/s/smtp_password -e MFA_ENCRYPTION_KEY_FILE=/s/mfa_encryption_key \
            -v "$PWD/secrets:/s:ro" -v ci-restored-storage:/var/lib/constitution/storage \
            -v "$PWD/../../ops/ci:/check:ro" "$API_IMAGE"
          for i in $(seq 1 30); do
            docker exec api-restored node -e "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" && break
            sleep 2
          done
          docker exec api-restored node /check/restored-app-check.mjs member@sample.test "$password"
          # Two-step sign-in survives backup and restore with the kept MFA_ENCRYPTION_KEY.
          sa_password="$(grep ' superadmin@sample.test ' seed-output.txt | head -n 1 | awk '{print $NF}')"
          sa_key="$(grep 'superadmin@sample.test two-step key:' seed-output.txt | awk '{print $NF}')"
          docker exec api-restored node /check/two-step-check.mjs superadmin@sample.test "$sa_password" "$sa_key"

      - name: Export one organisation and check it holds only that organisation
        run: |
          set -e
          choir="$(docker compose exec -T postgres psql -U constitution_owner -d constitution -Atc \
            "SELECT id FROM organisations WHERE slug = 'sample-community-choir'")"
          netball="$(docker compose exec -T postgres psql -U constitution_owner -d constitution -Atc \
            "SELECT id FROM organisations WHERE slug = 'sample-netball-club'")"
          docker compose --profile ops run --rm -T ops /ops/export-organisation.sh "$choir"
          file="$(ls exports/*.tar.gz.gpg | tail -n 1)"
          sudo gpg --batch --quiet --pinentry-mode loopback --passphrase-file secrets/backup_passphrase \
            --decrypt --output export.tar.gz "$file"
          mkdir export && sudo tar -C export -xzf export.tar.gz && sudo chown -R "$(id -u)" export
          root="$(ls -d export/*)"
          (cd "$root" && sha256sum --check --quiet SHA256SUMS)
          test "$(jq length "$root/data/sections.json")" -gt 0
          test "$(jq length "$root/data/people.json")" -gt 0
          ! grep -rq "$netball" "$root/data"
          ! grep -rqi 'password_hash\|token_hash' "$root/data"
          ! grep -rq 'netball' "$root/data/people.json"
          ls "$root/files" | head
          echo "[export-test] ok $(ls "$root/data" | wc -l) tables, $(find "$root/files" -type f | wc -l) files; no other organisation, no password or token hashes"

      - name: Seal the audit log, copy it off-site and check it (Task D12)
        run: |
          set -euo pipefail
          seal() { docker compose run --rm -T -e AUDIT_SEAL_SETTLE_SECONDS=0 api node dist/cli/audit-seal.js "$@"; }
          seal --public-key | tail -n 1 | sed 's/^/[seal-test] /'
          seal --seal | tee seal1.txt
          grep -q 'Sealed [1-9][0-9]* new entries' seal1.txt
          docker compose --profile ops run --rm -T ops /ops/audit-seal-offsite.sh | sed 's/^/[seal-test] /'
          seal --check --dir /var/lib/constitution/audit-check | tee check1.txt
          grep -q 'Result: OK' check1.txt
          # The add-only account cannot delete a sealed batch off-site.
          if docker compose --profile ops run --rm -T ops sh -c 'rclone deletefile "$OFFSITE_AUDIT_REMOTE/audit-seal-000001.json"' >/dev/null 2>&1; then
            echo "[seal-test] FAIL the add-only account deleted a sealed batch"; exit 1
          fi
          echo "[seal-test] ok sealed, copied off-site (add-only), checked: no differences"

      - name: Delete one organisation with the server command (after its export)
        run: |
          set -e
          q() { docker compose exec -T postgres psql -U constitution_owner -d constitution -Atqc "$1"; }
          netball="$(q "SELECT id FROM organisations WHERE slug = 'sample-netball-club'")"
          choir="$(q "SELECT id FROM organisations WHERE slug = 'sample-community-choir'")"
          choir_sections="$(q "SELECT count(*) FROM sections WHERE organisation_id = '$choir'")"
          admin="$(q "SELECT id FROM users WHERE email = 'superadmin@sample.test'")"
          # A request as the Control Centre would record it, made 25 hours ago (the command line
          # may confirm only after the 24-hour wait). Access must have ended first.
          q "UPDATE organisations SET status = 'suspended' WHERE id = '$netball'"
          q "INSERT INTO organisation_deletion_requests (organisation_id, reason, export_confirmed, requested_by_user_id, requested_at, expires_at)
             VALUES ('$netball', 'Deployment check: fictional organisation', true, '$admin', now() - interval '25 hours', now() + interval '6 days')"
          docker compose run --rm -T api node dist/cli/delete-organisation.js \
            --organisation "$netball" --approve --confirm sample-netball-club | tee delete-output.txt
          grep -q 'Files removed from storage' delete-output.txt
          test "$(q "SELECT count(*) FROM sections WHERE organisation_id = '$netball'")" = 0
          test "$(q "SELECT count(*) FROM memberships WHERE organisation_id = '$netball'")" = 0
          test "$(q "SELECT count(*) FROM audit_events WHERE organisation_id = '$netball' AND action <> 'organisation.deleted'")" = 0
          test "$(q "SELECT count(*) FROM users WHERE email LIKE 'netball.%@sample.test'")" = 0
          test -n "$(q "SELECT deleted_at FROM organisations WHERE id = '$netball'")"
          test "$(q "SELECT count(*) FROM sections WHERE organisation_id = '$choir'")" = "$choir_sections"
          docker compose run --rm -T --entrypoint sh api -c \
            "test ! -e /var/lib/constitution/storage/tenants/$netball && test -d /var/lib/constitution/storage/tenants/$choir"
          echo "[delete-test] ok netball deleted (database and files); choir untouched"

      - name: The audit check allows the deletion but detects tampering (Task D12)
        run: |
          set -uo pipefail
          seal() { docker compose run --rm -T -e AUDIT_SEAL_SETTLE_SECONDS=0 api node dist/cli/audit-seal.js "$@"; }
          offsite() { docker compose --profile ops run --rm -T ops /ops/audit-seal-offsite.sh >/dev/null; }
          check() { seal --check --dir /var/lib/constitution/audit-check > "$1" 2>&1; echo $?; }
          su() { docker compose exec -T postgres psql -U constitution_owner -d constitution -Atqc "$1"; }
          seal --seal >/dev/null && offsite
          status="$(check check2.txt)"; cat check2.txt
          test "$status" = 0 || { echo "[seal-test] FAIL the deletion was not accepted"; exit 1; }
          grep -Eq '[1-9][0-9]* removed with a deleted organisation' check2.txt
          # Tampering by someone with full database access (triggers switched off):
          victim="$(su "SELECT min(seq) FROM audit_events WHERE organisation_id IS NOT NULL")"
          su "SET session_replication_role = replica; UPDATE audit_events SET action = 'tampered.by.test' WHERE seq = $victim"
          status="$(check check3.txt)"; cat check3.txt
          test "$status" = 2 && grep -q "Entry $victim was changed" check3.txt \
            || { echo "[seal-test] FAIL a changed entry was not detected"; exit 1; }
          gone="$(su "SELECT max(a.seq) FROM audit_events a JOIN organisations o ON o.id = a.organisation_id WHERE o.slug = 'sample-community-choir'")"
          su "SET session_replication_role = replica; DELETE FROM audit_events WHERE seq = $gone"
          status="$(check check4.txt)"; cat check4.txt
          test "$status" = 2 && grep -q "Entry $gone is missing" check4.txt \
            || { echo "[seal-test] FAIL a deleted entry was not detected"; exit 1; }
          echo "[seal-test] ok deletion allowed; a changed and a deleted entry were both detected"

      - name: Summary
        if: always()
        run: |
          {
            echo '### Deployment check'
            echo "Backup tested: ${BACKUP:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 80 || true

      - name: Remove everything
        if: always()
        run: |
          docker rm -f api-restored 2>/dev/null || true
          docker compose --profile ops --profile migrate down -v --remove-orphans || true
          docker volume rm ci-restored-storage 2>/dev/null || true
