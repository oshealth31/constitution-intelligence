# Automated security scan with OWASP ZAP (task T5). Only ever against the throwaway copy of the
# app started inside this job, with FICTIONAL data; never against a real server.
#
# - Every pull request and push to main: PASSIVE scans (ZAP looks at pages and responses
#   without attacking), signed out and signed in as a fictional organisation owner.
# - Weekly, and when a branch named "scan/<anything>" is pushed: also an ACTIVE scan (ZAP sends
#   attack attempts such as injections and cross-site scripting), signed in.
#
# High and Medium findings fail the job unless listed with a reason in security/zap-accepted.tsv.
name: Security scan (ZAP)

on:
  pull_request:
  push:
    branches: [main, 'scan/**']
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC

permissions:
  contents: read

jobs:
  zap:
    name: Security scan (ZAP)
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_DB: ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://ci@localhost:5432/ci
      STORAGE_LOCAL_DIR: /tmp/zap-storage
      API_INTERNAL_URL: http://127.0.0.1:4100
      BASE_URL: http://127.0.0.1:3100
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable
      ACTIVE: ${{ github.event_name == 'schedule' || startsWith(github.ref, 'refs/heads/scan/') }}

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Build packages, API and web app
        run: |
          pnpm build:packages
          pnpm --filter @constitution/api run build
          pnpm --filter @constitution/web run build
      - name: Database with fictional data
        run: |
          pnpm --filter @constitution/db run migrate
          APP_ENV=local NODE_ENV=development LOG_LEVEL=warn node apps/api/dist/cli/seed-dev.js > seed.txt
          password="$(awk '$0 ~ / owner@sample\.test / {print $NF}' seed.txt | head -n 1)"
          test -n "$password"
          echo "::add-mask::$password"
          echo "OWNER_PASSWORD=$password" >> "$GITHUB_ENV"
          rm seed.txt
      - name: Start the API and the web app (production builds)
        run: |
          env NODE_ENV=test APP_ENV=test API_HOST=127.0.0.1 API_PORT=4100 \
            CORS_ORIGINS="$BASE_URL" TRUST_PROXY=true LOG_LEVEL=warn LOG_PRETTY=false \
            MAIL_TRANSPORT=log AI_PROVIDER=offline \
            API_RATE_LIMIT_PER_MINUTE=1000000 API_RATE_LIMIT_PER_ADDRESS_PER_MINUTE=10000000 \
            LOGIN_MAX_ATTEMPTS_PER_IP=10000 \
            nohup node apps/api/dist/main.js > api.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:4100/api/v1/health/live >/dev/null && break; sleep 1; done
          (cd apps/web && nohup node ./node_modules/next/dist/bin/next start --port 3100 --hostname 127.0.0.1 > ../../web.log 2>&1 &)
          for i in $(seq 1 60); do curl -fs "$BASE_URL/api/health" >/dev/null && break; sleep 1; done
      - name: Sign in as the fictional owner (session for the signed-in scans)
        run: |
          curl -fs -c cookies.txt -o /dev/null -X POST "$BASE_URL/api/v1/auth/login" \
            -H 'Content-Type: application/json' -H 'X-Requested-With: XMLHttpRequest' -H "Origin: $BASE_URL" \
            --data "{\"email\":\"owner@sample.test\",\"password\":\"$OWNER_PASSWORD\"}"
          session="$(awk '$6 == "ci_session" {print $7}' cookies.txt)"
          test -n "$session"
          echo "::add-mask::$session"
          echo "SESSION=$session" >> "$GITHUB_ENV"
          rm cookies.txt
          mkdir -p zap && chmod 0777 zap
          cp security/zap-accepted.tsv zap/
      - name: 'Passive scan: signed out'
        run: |
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t "$BASE_URL/o/sample-community-choir" -m 2 -I \
            -J zap-passive-signed-out.json -w zap-passive-signed-out.md || true
      - name: 'Passive scan: signed in (browser crawl)'
        run: |
          # Every request carries the session cookie and the anti-forgery header. Requests that
          # would end the session (sign out, password change, two-step changes) are sent to an
          # address that does not exist, so the scan stays signed in.
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t "$BASE_URL/o/sample-community-choir" -j -m 3 -I \
            -J zap-passive-signed-in.json -w zap-passive-signed-in.md \
            -z "$(security/zap-auth-options.sh)" || true
      - name: 'Active scan: signed in (weekly and scan/** branches)'
        if: env.ACTIVE == 'true'
        run: |
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-full-scan.py -t "$BASE_URL/o/sample-community-choir" -j -m 3 -I \
            -J zap-active-signed-in.json -w zap-active-signed-in.md \
            -z "$(security/zap-auth-options.sh) -config scanner.maxScanDurationInMins=40" || true
      - name: Results
        run: |
          reports="zap/zap-passive-signed-out.json zap/zap-passive-signed-in.json"
          if [ "$ACTIVE" = true ]; then reports="$reports zap/zap-active-signed-in.json"; fi
          set +e
          python3 security/zap-summary.py security/zap-accepted.tsv $reports > summary.md
          status=$?
          set -e
          { echo '# OWASP ZAP security scan (fictional data, throwaway copy)'; echo; cat summary.md; } >> "$GITHUB_STEP_SUMMARY"
          cat summary.md
          echo "API errors logged during the scans: $(grep -c '"level":50' api.log || true)"
          exit $status
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            zap/*.md
            zap/*.json
            api.log
          retention-days: 14
