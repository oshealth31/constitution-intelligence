# Secret scanning rules: gitleaks' standard rules, plus known-safe synthetic test values.
title = "Constitution Intelligence secret scan"

[extend]
useDefault = true

[allowlist]
description = "Synthetic development and test values (not real credentials)"
paths = [
  '''(^|/)\.env\.example$''',
  '''pnpm-lock\.yaml$''',
  # Hashed prefixes of publicly known leaked passwords (Task D5), not credentials.
  '''apps/api/data/breached-passwords\.bin$''',
]
# Publicly known leaked passwords used by tests to prove they are refused (Task D5).
regexes = [
  '''1qaz2wsx3edc''',
]
