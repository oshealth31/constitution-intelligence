# Local development services. NOT used in staging or production.
# Start:  pnpm db:up      Stop:  pnpm db:down
# Settings come from the root .env file (see .env.example).
name: constitution-intelligence

services:
  postgres:
    # PostgreSQL 16 with the pgvector extension pre-installed.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-constitution_dev}
    ports:
      # Bound to this computer only, never exposed to the local network.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
