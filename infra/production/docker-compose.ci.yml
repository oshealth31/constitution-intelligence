# CI ONLY (Deployment check workflow): adds a throwaway mail server (Mailpit) in place of the
# real email provider, so the test can check that an email really leaves the API over
# encrypted SMTP, and a throwaway S3-compatible object store (MinIO) in place of the off-site
# backup location (Task D7). Never used on a real server.
services:
  minio:
    image: minio/minio:latest
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: ci-minio-admin
      MINIO_ROOT_PASSWORD: ${CI_MINIO_PASSWORD:?generated by the deployment check}
    networks: [egress]
  mailpit:
    image: axllent/mailpit:v1.21
    environment:
      MP_SMTP_TLS_CERT: /certs/mail.crt
      MP_SMTP_TLS_KEY: /certs/mail.key
      MP_SMTP_REQUIRE_STARTTLS: 'true'
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
    volumes:
      - ./ci-mail:/certs:ro
    networks: [egress]
  api:
    depends_on:
      mailpit:
        condition: service_started
